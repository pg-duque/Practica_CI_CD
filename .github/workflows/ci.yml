name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Probar Lint
        run: npm run lint
      - name: Probar Formato
        run: npm run format:check
      - name: Probar tests unitarios
        run: npm run test:unit
      # TODO: tres steps distintos: lint, format:check y test:unit
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ejecutar tests de cobertura
        run: npm run coverage
      - name: guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # TODO: ejecutar npm run coverage
      # TODO: guardar coverage/ usando actions/upload-artifact@v4
      # TODO: que el artefacto se guarde incluso si las pruebas fallan
